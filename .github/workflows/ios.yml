name: iOS Build & Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate

      - name: Xcode test (iOS Simulator)
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; data=json.load(sys.stdin).get('devices',{}); picked='';\
for runtime in sorted(data.keys(), reverse=True):\
    for d in data[runtime]:\
        if d.get('isAvailable') and d.get('name','').startswith('iPhone'):\
            picked=d.get('udid',''); break\
    if picked: break\
print(picked)")

          if [ -z "$SIMULATOR_ID" ]; then
            echo "❌ No available iPhone simulator found on runner"
            exit 1
          fi

          echo "Using simulator id: $SIMULATOR_ID"

          xcodebuild \
            -project ios/ExpenseTracker.xcodeproj \
            -scheme ExpenseTracker \
            -destination "id=$SIMULATOR_ID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test
